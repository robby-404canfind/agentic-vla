# Agentic VLA final lab mission examples.
#
# Default Ch05 missions use the hall semantic map:
# system2_bringup/config/semantic_locations.hall.yaml
# and system2_bringup/config/patrol_routes.yaml.

missions:
  find_person:
    user_utterance: "사람을 찾아줘."
    expected_plan:
      - action: find
        params:
          target_class: person
    evaluation_focus:
      - natural language to known-class find
      - /system1/find action connection
      - center_after_find behavior

  follow_center_person:
    user_utterance: "화면 중앙에 있는 사람을 5초 동안 일정 거리 두고 따라가줘."
    expected_plan:
      - action: follow_query
        params:
          target_query: "화면 중앙에 있는 사람"
          max_time_sec: 5.0
    evaluation_focus:
      - target query to track ID resolution
      - resolve_target to follow handoff
      - bounded follow duration

  resolve_visible_target:
    user_utterance: "화면 중앙에 있는 사람이 누구인지 확인해서 알려줘."
    expected_plan:
      - action: resolve_target
        params:
          target_query: "화면 중앙에 있는 사람"
      - action: report
        params:
          status: latest_target
    evaluation_focus:
      - annotated snapshot use
      - track ID selection confidence
      - target result summary in report

  inspect_office_entrance:
    user_utterance: "오피스 입구로 가서 수상한 사람이 있는지 확인해서 보고해줘."
    semantic_target: office_entrance
    expected_plan:
      - action: go_to
        params:
          location: office_entrance
      - action: assess_scene
        params:
          query: "수상한 사람"
      - action: report
        params:
          status: latest_assessment
    evaluation_focus:
      - hall semantic location grounding
      - VLM scene assessment result
      - snapshot path in /system2/report

  patrol_and_report:
    user_utterance: "hall_short_loop을 짧게 순찰하고 수상한 사람이 있는지 평가해서 보고해줘."
    route: hall_short_loop
    expected_plan:
      - action: patrol
        params:
          area: hall_short_loop
      - action: assess_scene
        params:
          query: "수상한 사람"
      - action: report
        params:
          status: latest_assessment
    evaluation_focus:
      - route execution with hall patrol routes
      - assessment after navigation context
      - concise operator report
