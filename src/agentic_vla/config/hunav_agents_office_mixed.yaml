# HuNavSim office mixed scenario for smoke tests before the factory map is finalized.
#
# behavior.type:
#   1=regular, 2=impassive, 3=surprised, 4=scared, 5=curious, 6=threatening
#
# Copy this file to hunav_agent_manager/config/ and select it as configuration_file.

hunav_loader:
  ros__parameters:
    map: office
    publish_people: true
    agents:
      - person_1
      - person_2
      - person_3

    person_1:
      id: 1
      skin: 0
      group_id: -1
      max_vel: 1.2
      radius: 0.35
      behavior:
        type: 1
        configuration: 1
        duration: 40.0
        once: false
        vel: 0.6
        dist: 0.0
        goal_force_factor: 2.0
        obstacle_force_factor: 10.0
        social_force_factor: 5.0
        other_force_factor: 20.0
      init_pose:
        x: -3.0
        y: -2.0
        z: 1.25
        h: 0.0
      goal_radius: 0.3
      cyclic_goals: true
      goals:
        - g0
        - g1
      g0: {x: 5.0, y: 3.0, h: 1.25}
      g1: {x: -3.0, y: -2.0, h: 1.25}

    person_2:
      id: 2
      skin: 1
      group_id: -1
      max_vel: 0.8
      radius: 0.4
      behavior:
        type: 2
        configuration: 1
        duration: 40.0
        once: false
        vel: 0.4
        dist: 0.0
        goal_force_factor: 1.5
        obstacle_force_factor: 12.0
        social_force_factor: 7.0
        other_force_factor: 20.0
      init_pose:
        x: 1.0
        y: 8.0
        z: 1.25
        h: 3.14
      goal_radius: 0.3
      cyclic_goals: true
      goals:
        - g0
        - g1
      g0: {x: 1.0, y: -1.5, h: 1.25}
      g1: {x: 1.0, y: 8.0, h: 1.25}

    person_3:
      id: 3
      skin: 2
      group_id: -1
      max_vel: 1.0
      radius: 0.35
      behavior:
        type: 5
        configuration: 1
        duration: 25.0
        once: false
        vel: 0.5
        dist: 1.2
        goal_force_factor: 1.6
        obstacle_force_factor: 10.0
        social_force_factor: 5.0
        other_force_factor: 20.0
      init_pose:
        x: 3.0
        y: 6.0
        z: 1.25
        h: -1.57
      goal_radius: 0.3
      cyclic_goals: true
      goals:
        - g0
        - g1
      g0: {x: -1.0, y: 6.0, h: 1.25}
      g1: {x: 3.0, y: 6.0, h: 1.25}
